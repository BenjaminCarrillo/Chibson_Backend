# Los tests usan H2 en memoria, así no necesitan MySQL encendido.
spring.application.name=productos
spring.datasource.url=jdbc:h2:mem:productos;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
server.error.include-message=always
servicios.usuarios.url=http://localhost:8081
servicios.ventas.url=http://localhost:8083
