spring.application.name=productos
server.port=8087

# ---------- Base de datos MySQL ----------
# La base se crea sola si no existe. Cambien usuario y contraseña por los de su MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/chibson_productos?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Muestra el mensaje de error en la respuesta (por ejemplo, "El precio debe ser mayor que cero")
server.error.include-message=always

# ---------- Otros microservicios ----------
servicios.usuarios.url=http://localhost:8091
servicios.ventas.url=http://localhost:8083

# ---------- Imágenes subidas desde el panel ----------
# Carpeta donde se guardan, relativa a la carpeta desde donde se inicia el microservicio
# (con el comando de inicio queda en Chibson_Backend/productos/uploads). Se crea sola si no existe.
imagenes.carpeta=uploads
# Tamaño máximo de cada imagen
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
