spring.application.name=usuarios
server.port=8081

# ---------- Base de datos MySQL ----------
# La base se crea sola si no existe. Cambien usuario y contraseña por los de su MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/chibson_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Muestra el mensaje de error en la respuesta (por ejemplo, "El RUT no tiene un formato válido")
server.error.include-message=always

# ---------- Otros microservicios ----------
servicios.ventas.url=http://localhost:8083
