spring.application.name=informes
server.port=8086

# Base de datos MySQL (se crea sola si no existe). Guarda los reportes generados (HU-60 a HU-62).
spring.datasource.url=jdbc:mysql://localhost:3306/chibson_informes?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Muestra el mensaje de error en las respuestas
server.error.include-message=always

# Otros microservicios
servicios.usuarios.url=http://localhost:8081
servicios.productos.url=http://localhost:8087
servicios.ventas.url=http://localhost:8083
servicios.soporte.url=http://localhost:8084

# Reportes automáticos (HU-49). Ponerlo en false desactiva la generación al iniciar y la programada.
reportes.automaticos.activos=true
