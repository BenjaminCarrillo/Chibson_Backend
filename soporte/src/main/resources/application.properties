spring.application.name=soporte
server.port=8084

# Base de datos MySQL (se crea sola si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/chibson_soporte?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Muestra el mensaje de error en las respuestas
server.error.include-message=always

# Otros microservicios
servicios.usuarios.url=http://localhost:8081
