spring.application.name=contenido
server.port=8085

# ---------- Base de datos MySQL ----------
# La base se crea sola si no existe. Cambien usuario y contraseña por los de su MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/chibson_contenido?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Muestra el mensaje de error en la respuesta (por ejemplo, "El título es obligatorio")
server.error.include-message=always

# ---------- Otros microservicios ----------
servicios.usuarios.url=http://localhost:8081
