spring.application.name=contenido
server.port=8085

# ---------- Base de datos MySQL ----------
# La base se crea sola si no existe. Cambien usuario y contraseña por los de su MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/chibson_contenido?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Muestra el mensaje de error en la respuesta (por ejemplo, "El título es obligatorio")
server.error.include-message=always

# ---------- Otros microservicios ----------
servicios.usuarios.url=http://localhost:8091

# ---------- Imágenes subidas desde el panel ----------
# Carpeta donde se guardan, relativa a la carpeta desde donde se inicia el microservicio
# (con el comando de inicio queda en Chibson_Backend/contenido/uploads). Se crea sola si no existe.
imagenes.carpeta=uploads
# Tamaño máximo de cada imagen
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- JWT ----------
# Misma clave en TODOS los microservicios y el gateway (mínimo 32 caracteres)
jwt.secreto=chibson-instruments-clave-secreta-jwt-2026-duoc-uc
